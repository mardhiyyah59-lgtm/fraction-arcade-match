<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fraction Arcade — Interactive Game</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05051a;font-family:Arial,Helvetica,sans-serif}
#app{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
#stage{
  position:relative;
  width:min(100vw,177.7778vh);
  height:min(100vh,56.25vw);
  max-width:1920px;
  max-height:1080px;
  overflow:hidden;
  border-radius:10px;
  box-shadow:0 0 35px rgba(0,0,0,.7);
  animation:stageGlow 4s ease-in-out infinite;
}
#pageImg{
  width:100%;height:100%;display:block;object-fit:cover;
  user-select:none;-webkit-user-drag:none;
  transform-origin:center;
  animation:arcadeBreath 7s ease-in-out infinite;
  transition:opacity .25s ease,transform .35s ease;
}
#stage.page-change #pageImg{
  opacity:.72;
  transform:scale(1.018);
}
#hotspots{position:absolute;inset:0}
.hot{
  position:absolute;
  border:0;
  background:rgba(255,255,255,0);
  cursor:pointer;
  border-radius:18px;
  transition:transform .16s ease,background .16s ease,box-shadow .16s ease;
  outline:none;
  animation:softFloat 3.5s ease-in-out infinite;
}
.hot:hover{
  background:rgba(255,255,255,.09);
  box-shadow:0 0 18px rgba(80,220,255,.45),inset 0 0 10px rgba(255,255,255,.08);
  transform:scale(1.035);
}
.hot:active{
  transform:scale(.96);
  box-shadow:0 0 28px rgba(255,255,255,.75);
}
#fx{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
  z-index:2;
}
.spark{
  position:absolute;
  width:5px;height:5px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 7px 2px rgba(120,220,255,.9);
  opacity:.0;
  animation:sparkle var(--dur) ease-in-out var(--delay) infinite;
}
.scan{
  position:absolute;left:0;right:0;height:2px;top:-5px;
  background:linear-gradient(90deg,transparent,rgba(100,220,255,.22),transparent);
  box-shadow:0 0 12px rgba(100,220,255,.25);
  animation:scan 6s linear infinite;
}
#pageLabel{
  position:absolute;right:10px;bottom:8px;
  color:rgba(255,255,255,.22);
  font-size:11px;pointer-events:none;z-index:3
}
#loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:white;background:#070722;font-size:20px;z-index:5
}

@keyframes arcadeBreath{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.006)}
}
@keyframes stageGlow{
  0%,100%{box-shadow:0 0 35px rgba(0,0,0,.7)}
  50%{box-shadow:0 0 48px rgba(55,180,255,.16),0 0 35px rgba(0,0,0,.7)}
}
@keyframes softFloat{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.035)}
}
@keyframes sparkle{
  0%{opacity:0;transform:translateY(15px) scale(.5)}
  25%{opacity:.75}
  55%{opacity:.25;transform:translateY(-25px) scale(1)}
  100%{opacity:0;transform:translateY(-55px) scale(.4)}
}
@keyframes scan{
  0%{top:-5px;opacity:0}
  8%{opacity:.8}
  92%{opacity:.8}
  100%{top:105%;opacity:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:700px){
  #stage{border-radius:0}
  .hot:hover{background:transparent;box-shadow:none}
}

#musicToggle{
  position:fixed;right:16px;top:16px;z-index:20;
  width:46px;height:46px;border:0;border-radius:50%;
  background:rgba(10,15,55,.82);color:#fff;font-size:21px;
  cursor:pointer;box-shadow:0 0 14px rgba(60,200,255,.35);
  backdrop-filter:blur(4px);
}
#musicToggle:hover{transform:scale(1.08)}
</style>
</head>

const H = {"9":[["g1",13,24,26,36],["g2",38,24,25,36],["g3",63,24,25,36],["g4",20,58,30,38],["g5",51,58,29,38]],"10":[["left",26,68,25,15],["right",52,68,26,15]],"11":[["left",26,68,25,15],["right",52,68,26,15]],"12":[["left",26,68,25,15],["right",52,68,26,15]],"13":[["left",26,68,25,15],["right",52,68,26,15]],"16":[["A",42.8,43.0,12.8,34.5],["B",54.5,43.0,12.8,34.5],["C",66.2,43.0,11.2,34.5]],"17":[["A",42.8,43.0,12.8,34.5],["B",54.5,43.0,12.8,34.5],["C",66.2,43.0,11.2,34.5]],"18":[["A",42.8,43.0,12.8,34.5],["B",54.5,43.0,12.8,34.5],["C",66.2,43.0,11.2,34.5]],"19":[["A",42.8,43.0,12.8,34.5],["B",54.5,43.0,12.8,34.5],["C",66.2,43.0,11.2,34.5]],"22":[[">",43,45,14,12],["<",43,57,14,12],["=",43,69,14,12]],"23":[[">",43,45,14,12],["<",43,57,14,12],["=",43,69,14,12]],"24":[[">",43,45,14,12],["<",43,57,14,12],["=",43,69,14,12]],"25":[[">",43,45,14,12],["<",43,57,14,12],["=",43,69,14,12]],"28":[["A",23,43,27,38],["B",51,43,27,38]],"29":[["A",23,43,27,38],["B",51,43,27,38]],"30":[["A",23,43,27,38],["B",51,43,27,38]],"31":[["A",23,43,27,38],["B",51,43,27,38]],"34":[["A",25,49,25,32],["B",51,49,26,32]],"35":[["A",25,49,25,32],["B",51,49,26,32]],"36":[["A",25,49,25,32],["B",51,49,26,32]],"37":[["A",25,49,25,32],["B",51,49,26,32]],"1":[["start",38,72,25,18]],"2":[["next",35,84,30,14]],"3":[["next",35,84,30,14]],"4":[["next",35,84,30,14]],"5":[["next",35,84,30,14]],"6":[["next",35,84,30,14]],"7":[["next",35,84,30,14]],"8":[],"14":[["next",35,84,30,14]],"20":[["next",35,84,30,14]],"26":[["next",35,84,30,14]],"32":[["next",35,84,30,14]],"38":[["next",35,84,30,14]],"15":[["retry",35,83,30,15]],"21":[["retry",35,83,30,15]],"27":[["retry",35,83,30,15]],"33":[["retry",35,83,30,15]],"39":[["retry",35,83,30,15]],"40":[["playAgain",27,72,25,18],["home",53,72,25,18]]};
const R = {"1":{"next":2},"2":{"next":3},"3":{"next":4},"4":{"next":5},"5":{"next":6},"6":{"next":7},"7":{"next":9},"8":{"next":9},"10":{"answers":["left","right"],"correct":"right","ok":14,"bad":15},"11":{"answers":["left","right"],"correct":"right","ok":14,"bad":15},"12":{"answers":["left","right"],"correct":"right","ok":14,"bad":15},"13":{"answers":["left","right"],"correct":"left","ok":14,"bad":15},"16":{"answers":["A","B","C"],"correct":"A","ok":20,"bad":21},"17":{"answers":["A","B","C"],"correct":"A","ok":20,"bad":21},"18":{"answers":["A","B","C"],"correct":"B","ok":20,"bad":21},"19":{"answers":["A","B","C"],"correct":"A","ok":20,"bad":21},"22":{"answers":[">","<","="],"correct":">","ok":26,"bad":27},"23":{"answers":[">","<","="],"correct":"<","ok":26,"bad":27},"24":{"answers":[">","<","="],"correct":">","ok":26,"bad":27},"25":{"answers":[">","<","="],"correct":"<","ok":26,"bad":27},"28":{"answers":["A","B"],"correct":"B","ok":32,"bad":33},"29":{"answers":["A","B"],"correct":"A","ok":32,"bad":33},"30":{"answers":["A","B"],"correct":"B","ok":32,"bad":33},"31":{"answers":["A","B"],"correct":"B","ok":32,"bad":33},"34":{"answers":["A","B"],"correct":"B","ok":38,"bad":39},"35":{"answers":["A","B"],"correct":"B","ok":38,"bad":39},"36":{"answers":["A","B"],"correct":"B","ok":38,"bad":39},"37":{"answers":["A","B"],"correct":"A","ok":38,"bad":39},"14":{"next":0},"20":{"next":0},"26":{"next":0},"32":{"next":0},"38":{"next":0},"15":{"retry":0},"21":{"retry":0},"27":{"retry":0},"33":{"retry":0},"39":{"retry":0},"40":{"home":1,"playAgain":9}};

const fx = document.getElementById('fx');
const stage = document.getElementById('stage');

function makeSparkles(){
  if(!fx) return;
  fx.querySelectorAll('.spark').forEach(e=>e.remove());
  for(let i=0;i<18;i++){
    const s=document.createElement('span');
    s.className='spark';
    s.style.left=(5+Math.random()*90)+'%';
    s.style.top=(15+Math.random()*70)+'%';
    s.style.setProperty('--dur',(2.5+Math.random()*3.5)+'s');
    s.style.setProperty('--delay',(-Math.random()*5)+'s');
    fx.appendChild(s);
  }
}

function animatePageChange(){
  stage.classList.remove('page-change');
  void stage.offsetWidth;
  stage.classList.add('page-change');
  setTimeout(()=>stage.classList.remove('page-change'),380);
}


const gameQuestions = {
  1:[10,11,12,13],
  2:[16,17,18,19],
  3:[22,23,24,25],
  4:[28,29,30,31],
  5:[34,35,36,37]
};

function gameOfQuestion(p){
  for(const [g,qs] of Object.entries(gameQuestions)){
    if(qs.includes(p)) return Number(g);
  }
  return null;
}

function nextQuestionOrMenu(){
  const g=gameOfQuestion(currentQuestion);
  if(!g) return go(9);
  const qs=gameQuestions[g];
  const i=qs.indexOf(currentQuestion);

  if(i<qs.length-1){
    currentQuestion=qs[i+1];
    return go(currentQuestion);
  }

  // The player has completed all 4 questions in this game.
  completedGames.add(g);
  currentQuestion=null;

  // After Game 5, show Thank You only when all five games have been completed.
  if(g===5 && completedGames.size===5){
    return go(40);
  }

  // Games 1–4 return to Choose Your Game.
  return go(9);
}

function retryCurrentQuestion(){
  return currentQuestion ? go(currentQuestion) : go(9);
}

function go(n,push=true){
  if(n<1 || n>40) return;
  animatePageChange();
  if(push && page!==n) history.push(page);
  page=n;
  img.src=IMAGES[n-1];
  label.textContent=`${n} / 40`;
  render();
}

function action(type){
  const r=R[page]||{};

  if(type==='start') return go(2);

  if(type==='next'){
    // On CORRECT pages, continue within the same game.
    if([14,20,26,32,38].includes(page)) return nextQuestionOrMenu();
    return r.next ? go(r.next) : null;
  }

  if(type==='retry') return retryCurrentQuestion();

  if(type==='playAgain'){ completedGames.clear(); currentQuestion=null; return go(9); }
  if(type==='home'){ completedGames.clear(); currentQuestion=null; return go(1); }

  if(type==='g1'){currentQuestion=10;return go(10);}
  if(type==='g2'){currentQuestion=16;return go(16);}
  if(type==='g3'){currentQuestion=22;return go(22);}
  if(type==='g4'){currentQuestion=28;return go(28);}
  if(type==='g5'){currentQuestion=34;return go(34);}

  if(r.answers && r.answers.includes(type)){
    currentQuestion=page;
    return go(type===r.correct ? r.ok : r.bad);
  }
}

function render(){
  layer.innerHTML='';
  (H[page]||[]).forEach(([type,x,y,w,h])=>{
    const b=document.createElement('button');
    b.className='hot';
    b.style.left=x+'%';
    b.style.top=y+'%';
    b.style.width=w+'%';
    b.style.height=h+'%';
    b.setAttribute('aria-label',type);
    b.onclick=()=>action(type);
    layer.appendChild(b);
  });
}

img.onload=()=>{document.getElementById('loading').style.display='none';makeSparkles();};
go(1,false);

const bgMusic = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');
let musicOn = true;

async function startMusic(){
  if(!bgMusic || !musicOn) return;
  try{
    bgMusic.volume = 0.28;
    await bgMusic.play();
  }catch(e){}
}
function updateMusicButton(){
  if(musicToggle) musicToggle.textContent = musicOn ? '🔊' : '🔇';
}
if(musicToggle){
  musicToggle.onclick = async ()=>{
    musicOn = !musicOn;
    if(musicOn) await startMusic();
    else bgMusic.pause();
    updateMusicButton();
  };
  updateMusicButton();
}
document.addEventListener('click', startMusic, {once:true});
